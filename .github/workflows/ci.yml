name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppass
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U appuser" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Backend Steps
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Backend test (with coverage)
        working-directory: ./Backend
        run: |
          go mod tidy
          go test ./...

      - name: Build Docker image for backend
        run: |
          docker build -t devops-api ./Backend

      # Frontend Steps - ADD THESE
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "16"

      - name: Build Docker image for frontend
        run: |
          docker build -t devops-frontend ./frontend

      # Docker Hub Push
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker images to Docker Hub
        run: |
          docker tag devops-api parashartanish22/devops-api:latest 
          docker push parashartanish22/devops-api:latest

          docker tag devops-frontend parashartanish22/devops-frontend:latest
          docker push parashartanish22/devops-frontend:latest
