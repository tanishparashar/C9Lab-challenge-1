version: "3.9"

services:
  # Backend Service
  backend:
    build:
      context: ./Backend # Updated to the Backend folder
      dockerfile: Dockerfile
    container_name: devops-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://appuser:apppass@postgres:5432/appdb?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - app_network

  # Frontend Service
  frontend:
    build:
      context: ./frontend # Updated to the frontend folder
      dockerfile: Dockerfile
    container_name: devops-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app_network

  # PostgreSQL Database Service
  postgres:
    image: postgres:16
    container_name: devops-db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  # SonarQube Service (Self-Hosted)
  sonar_db:
    image: postgres:16
    container_name: sonar-postgres
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonar_pgdata:/var/lib/postgresql/data
    networks:
      - sonar_network

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    environment:
      SONAR_JDBC_URL: "jdbc:postgresql://sonar_db:5432/sonarqube"
      SONAR_JDBC_USERNAME: "sonar"
      SONAR_JDBC_PASSWORD: "sonar"
    ports:
      - "9000:9000"
    networks:
      - sonar_network

networks:
  app_network:
  sonar_network:

volumes:
  postgres_data:
  sonar_pgdata:
