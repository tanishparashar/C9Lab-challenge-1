sonar.projectKey=your_project_key
sonar.projectName=Your Project Name
sonar.projectVersion=1.0

# Path to source directories (backend + frontend)
sonar.sources=Backend,frontend
sonar.exclusions=**/node_modules/**,**/build/**,**/vendor/**

# Coverage reports (adjust to your setup)
sonar.go.coverage.reportPaths=Backend/coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov-info
